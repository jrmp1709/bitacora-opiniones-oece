# Prueba única: ¿responde gob.pe a los servidores de GitHub? Dos solicitudes, con el User-Agent del proyecto.
# Si gob.pe bloquea (403, 418, 429), se respeta: la actualización automática correrá en la PC del autor.
name: Prueba de acceso a gob.pe
on:
  push:
    paths: [".github/workflows/prueba-gobpe.yml"]
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: robots.txt y la colección de opiniones del OECE
        run: |
          UA="BitacoraOpiniones/1.0 (indice publico de opiniones de la DTN; +https://jrmp1709.github.io/bitacora-opiniones-oece/)"
          r=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" https://www.gob.pe/robots.txt)
          echo "robots.txt: $r"
          sleep 2
          c=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "https://www.gob.pe/institucion/oece/colecciones/66839-opiniones-de-la-direccion-tecnico-normativa-oece")
          echo "coleccion: $c"
          test "$r" = 200 && test "$c" = 200

# Actualización automática de la Bitácora de Opiniones OECE, cada 5 días, en los servidores de GitHub:
# no depende de Claude ni de que la PC del autor esté encendida.
# Busca opiniones nuevas en gob.pe, las clasifica, valida sus referencias y, si todo está en orden, publica.
# Con gob.pe: una solicitud por segundo y User-Agent del proyecto; si bloquea el acceso, se detiene sin esquivarlo.
name: Actualizar bitácora

on:
  schedule:
    - cron: "0 14 1,6,11,16,21,26 * *"   # 9:00 en Lima (UTC-5), los días 1, 6, 11, 16, 21 y 26
  workflow_dispatch:                      # también a mano: pestaña Actions → Actualizar bitácora → Run workflow
  push:                                   # y cuando cambia el código del sitio o el Excel procesado:
    branches: [main]                      # la nube regenera index.html y lo publica
    paths: ["src/**", "scripts/**", "data/excel.json", "requirements.txt", ".github/workflows/actualizar.yml"]

permissions:
  contents: write   # subir los datos y el sitio regenerado
  pages: write      # pedir a GitHub Pages que publique

concurrency:
  group: actualizar-bitacora
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Buscar, clasificar, validar y publicar
        id: act
        env:
          TZ: America/Lima
        run: |
          git config user.name "Bitácora de Opiniones (actualización automática)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/actualizar.py --publicar

      - name: Pedir a GitHub Pages que publique
        if: steps.act.outputs.publicado == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "GitHub Pages publicará con el propio push"
